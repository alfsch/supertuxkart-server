# Three servers (race, soccer, battle) with bots, on one host. Copy to compose.yaml; `docker compose up -d`.
# Copied from the deploy brief (supertuxkart-server-deploy.md, section 4); see the README for the image interface.
#
# - network_mode: host is deliberate: LAN discovery needs UDP broadcast, and published ports would bypass the host firewall.
# - Only one instance per host can own the discovery port 2757: `race` (the others wait for it, STK_START_DELAY). Players
#   join soccer and battle through "Enter server address" with <host-ip>:2760 and :2761.
# - Single instance: keep only `race` and `race-bots`; no start delay is needed.
# - start_period and STK_START_DELAY: the server is healthy about a second after it starts on an amd64 desktop; measure on
#   the target host (a Raspberry Pi is slower) and leave plenty of margin.
# - Hardening: read-only root file system with a tmpfs for the home directory (STK writes its config and cache there; the stk
#   user is uid/gid 999), no capabilities, no privilege gain. Tried with a server and bots on 1.5.8: both start and join.
# - One human races against the bots in `race` (STK_MIN_PLAYERS defaults to 1). With STK_AI_HANDLING=true STK keeps the bots out of
#   soccer and battle, so a game there needs STK_MIN_PLAYERS humans; set STK_AI_HANDLING: "false" on those two to let the bots
#   fill them and start games on their own.
# - Keep a join password out of this file: env_file with mode 600, STK_SERVER_PASSWORD (or STK_SERVER_PASSWORD_FILE).
x-stk: &stk
  image: ghcr.io/alfsch/supertuxkart-server:1.5   # newest build of STK 1.5; :latest would follow a future STK 1.6, which 1.5 clients cannot join
  network_mode: host
  restart: unless-stopped
  ulimits: { core: 0 }
  read_only: true
  tmpfs: ["/home/stk:uid=999,gid=999,mode=0700"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-health: &health
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 60s     # set from the hand-off's measured time to healthy + margin

services:
  race:                 # the LAN-discoverable instance (option A); starts first
    <<: *stk
    environment: { STK_MODE: server, STK_PORT: "2759", STK_GAME_MODE: normal-race, STK_SERVER_NAME: "game-server Race" }
    healthcheck:
      <<: *health
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "2757", "2759"]   # discovery + game port
  race-bots:
    <<: *stk
    environment: { STK_MODE: bots, STK_SERVER: "127.0.0.1:2759", STK_BOTS: "4" }
    depends_on: { race: { condition: service_healthy } }
  soccer:
    <<: *stk
    environment: { STK_MODE: server, STK_PORT: "2760", STK_GAME_MODE: soccer, STK_SERVER_NAME: "game-server Soccer", STK_START_DELAY: "120" }
    healthcheck:
      <<: *health
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "2760"]
    depends_on: { race: { condition: service_healthy } }
  soccer-bots:
    <<: *stk
    environment: { STK_MODE: bots, STK_SERVER: "127.0.0.1:2760", STK_BOTS: "3" }
    depends_on: { soccer: { condition: service_healthy } }
  battle:
    <<: *stk
    environment: { STK_MODE: server, STK_PORT: "2761", STK_GAME_MODE: ffa, STK_SERVER_NAME: "game-server Battle", STK_START_DELAY: "120" }
    healthcheck:
      <<: *health
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "2761"]
    depends_on: { race: { condition: service_healthy } }
  battle-bots:
    <<: *stk
    environment: { STK_MODE: bots, STK_SERVER: "127.0.0.1:2761", STK_BOTS: "3" }
    depends_on: { battle: { condition: service_healthy } }
