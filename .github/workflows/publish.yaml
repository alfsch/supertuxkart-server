name: Publish image

# Builds the SuperTuxKart server (Dockerfile, SERVER_ONLY) for amd64 and arm64 and publishes it to
# ghcr.io/alfsch/supertuxkart-server under four tags: `latest`, the STK version (`1.5`), a dated one (`1.5-20261122`) and a
# release number (`1.5.3`). Every publish that changes the image gets the next release number of its STK version
# (.github/scripts/next-patch.sh: one above the highest `1.5.<n>` tag in the registry, starting at `.0`), so the last number
# counts the releases of that STK version, and an automatic one, such as the merge of a Renovate update of the Debian base
# image, is a new patch level. A deployment can pin the release number or the dated tag; prune.yaml works on both. Each
# release number also gets a GitHub release (git tag `v1.5.3`), except those of the weekly run.
#
# A build that did not change the image publishes nothing: the compare job checks whether the platform images just built are
# exactly those of the index `latest` points at (.github/scripts/image-unchanged.sh). If so there is no new tag, signature,
# smoke test or release, and no release number is used up; only the scan still runs, on the image that is published.
#
# STK_VERSION is the default of the ARG in the Dockerfile, with the sha256 of that release's source tarball next to it.
# workflow_dispatch can build another release (stk_version): the checksum is then read from the GitHub release. Clients and
# servers of different STK major versions do not play together, so change the default only when the players update.
#
# The weekly run rebuilds as well. It uses the build cache, so the C++ build only runs again when the base image or the sources
# changed (`pull: true` makes a new base image invalidate it). The apt layer of the runtime stage is rebuilt once a week: the
# first publish of a new ISO week passes it a new APT_REFRESH (the `week` output below), so the Debian packages are current
# even while the cache holds. If a package was updated meanwhile the image differs and is released (without a GitHub release
# when it is the weekly run); if nothing changed, the digests are the same and the run is only a scan. When the cache is gone
# (GitHub drops caches that were not used for seven days) the image is built again from scratch and is released the same way.
#
# The merged index (what every tag points at) is signed keylessly with cosign (Sigstore): the signature binds the image digest
# to this workflow on main. The identity to verify is https://github.com/alfsch/supertuxkart-server/.github/workflows/publish.yaml@refs/heads/main
# (the README has the command), so renaming this file or publishing from another branch changes it. The smoke job verifies
# the signature of what it pulls, on a clean runner, the way a user would.
#
# The signed digest is scanned with Trivy afterwards (the scan job), on both architectures; a build that changed nothing scans
# the image that is already published. It only reports: the findings are in the job summary and the job never fails the run on
# them, since the image is already published and signed by then and the weekly run is what picks up fixes.
#
# The package is public and linked to this repository (GitHub: Packages > supertuxkart-server > Package settings). Cron
# times are UTC.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - healthcheck.sh
      - LICENSE
      - .github/scripts/smoke-test.sh
      - .github/scripts/next-patch.sh
      - .github/scripts/image-unchanged.sh
      - .github/workflows/publish.yaml
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      stk_version:
        description: STK release to build (empty for the default in the Dockerfile)
        default: ""
      force:
        description: Release even if the build gave the same image as the last release
        type: boolean
        default: false

permissions:
  contents: read

# Two publishes of the same tags must not interleave; a running one is finished, not cancelled.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/alfsch/supertuxkart-server

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.meta.outputs.sha256 }}
      date: ${{ steps.meta.outputs.date }}
      patch: ${{ steps.meta.outputs.patch }}
      week: ${{ steps.meta.outputs.week }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.stk_version }}
        run: |
          default="$(sed -n 's/^ARG STK_VERSION=//p' Dockerfile | head -n1)"
          version="${REQUESTED:-$default}"
          [[ "$version" =~ ^[0-9][0-9A-Za-z.-]*$ ]] || { echo "not a version: '$version'" >&2; exit 1; }
          if [ "$version" = "$default" ]; then
            # the checksum pinned in the Dockerfile is independent of the download
            sha256="$(sed -n 's/^ARG STK_SHA256=//p' Dockerfile | head -n1)"
          else
            sha256="$(gh api "repos/supertuxkart/stk-code/releases/tags/$version" \
              --jq ".assets[] | select(.name == \"SuperTuxKart-$version-src.tar.gz\") | .digest" | sed 's/^sha256://')"
          fi
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "no sha256 for STK $version" >&2; exit 1; }
          patch="$version.$(.github/scripts/next-patch.sh "$IMAGE" "$version")"
          echo "release number: $patch"
          {
            echo "version=$version"
            echo "sha256=$sha256"
            echo "date=$(date -u +%Y%m%d)"
            echo "week=$(date -u +%G-W%V)"
            echo "patch=$patch"
          } >> "$GITHUB_OUTPUT"

  # One native build per architecture (QEMU would make the C++ build take hours), pushed by digest and joined into one
  # multi-arch tag by the merge job.
  build:
    needs: meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          build-args: |
            STK_VERSION=${{ needs.meta.outputs.version }}
            STK_SHA256=${{ needs.meta.outputs.sha256 }}
            APT_REFRESH=${{ needs.meta.outputs.week }}
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Did the build change the image? A cached build gives the digests of the last release again, and then there is nothing to
  # release. An answer the registry cannot give fails this job (and with it the run) instead of being guessed.
  compare:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unchanged: ${{ steps.compare.outputs.unchanged }}
      current: ${{ steps.compare.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - id: compare
        env:
          FORCE: ${{ inputs.force }}
        run: |
          out="$(.github/scripts/image-unchanged.sh "$IMAGE" "$RUNNER_TEMP/digests")"
          unchanged="$(sed -n 's/^unchanged=//p' <<<"$out")"
          current="$(sed -n 's/^current=//p' <<<"$out")"
          if [ "$FORCE" = true ]; then
            [ "$unchanged" != true ] || echo "Forced: releasing although the image is unchanged." >> "$GITHUB_STEP_SUMMARY"
            unchanged=false
          elif [ "$unchanged" = true ]; then
            echo "Image unchanged: the platform images built are those of $IMAGE:latest. No new tags, signature or release." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "unchanged=$unchanged  current=$current"
          {
            echo "unchanged=$unchanged"
            echo "current=$current"
          } >> "$GITHUB_OUTPUT"

  merge:
    needs: [meta, build, compare]
    if: needs.compare.outputs.unchanged != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.create.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write   # the OIDC token cosign signs with
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        id: create
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          DATE: ${{ needs.meta.outputs.date }}
          PATCH: ${{ needs.meta.outputs.patch }}
        run: |
          cd "$RUNNER_TEMP/digests"
          sources="$(printf "$IMAGE@sha256:%s " *)"
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            -t "$IMAGE:latest" -t "$IMAGE:$VERSION" -t "$IMAGE:$VERSION-$DATE" -t "$IMAGE:$PATCH" $sources
          docker buildx imagetools inspect "$IMAGE:$PATCH"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$PATCH" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
          echo "published $IMAGE:$PATCH" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image
        env:
          DIGEST: ${{ steps.create.outputs.digest }}
        run: |
          # the digest, not a tag: a tag could be moved by anything else that writes to the package, and this workflow would
          # sign whatever it points at with its own identity
          cosign sign --yes "$IMAGE@$DIGEST"

  # Vulnerability report for the digest that was just signed, or, when the build changed nothing, for the one that is already
  # published (so the weekly run still reports new CVEs). Trivy scans one platform of an index (the host's by default), so
  # both are named. Report only: exit-code 0 keeps findings from failing the job, continue-on-error keeps a scanner, database
  # or registry error from failing the workflow after the image is published. The table goes to the job summary and, through
  # tee, to the job log, which is what `gh run view --log` and the API can read (the API has no endpoint for summaries).
  # Unfixed CVEs are left out, they cannot be acted on. Only the vulnerability scanner runs: the secret scanner would read all
  # the game data for nothing. Trivy sees the Debian packages; the libraries bundled in the STK binary (bullet, enet, mcpp) and
  # the game data are not in its scope.
  scan:
    needs: [compare, merge]
    if: ${{ !cancelled() && needs.compare.result == 'success' && (needs.merge.result == 'success' || needs.compare.outputs.unchanged == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.merge.outputs.digest || needs.compare.outputs.current }}
          scanners: vuln
          format: table
          output: trivy-report.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Report in the job summary
        if: ${{ !cancelled() }}
        env:
          DIGEST: ${{ needs.merge.outputs.digest || needs.compare.outputs.current }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          {
            echo "### Trivy: $IMAGE@$DIGEST ($PLATFORM)"
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo "no report: the scan did not finish"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # What a user does: pull the published image (by the digest that was signed, which no later push can move) and run a server with bots, on both architectures, on a clean runner with
  # no local copy of the image.
  smoke:
    needs: [meta, merge]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: The signature verifies
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish.yaml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Server and bots
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: .github/scripts/smoke-test.sh "$IMAGE@$DIGEST"

  # The GitHub release for the numbered image (git tag v<release number>, notes generated from the merged PRs since the last
  # release), once the published tag has passed the smoke test on both architectures. The weekly run is left out: it still
  # takes a release number, so its image has a tag but no GitHub release, and the releases skip those numbers. This is the only
  # job that writes to the repository; releases made with GITHUB_TOKEN start no other workflow.
  release:
    needs: [meta, merge, smoke]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          DATE: ${{ needs.meta.outputs.date }}
          PATCH: ${{ needs.meta.outputs.patch }}
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          # a re-run of this job alone must not fail on the release it made before
          if gh release view "v$PATCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$PATCH exists already"
            exit 0
          fi
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no image digest to name in the notes: '$DIGEST'" >&2; exit 1; }
          notes="$(printf '%s\n' \
            "Container image \`$IMAGE:$PATCH\` (SuperTuxKart $VERSION, linux/amd64 and linux/arm64)." \
            "" \
            "- digest: \`$DIGEST\`" \
            "- also tagged \`latest\`, \`$VERSION\` and \`$VERSION-$DATE\`" \
            "- signed with cosign (keyless); the README shows how to verify it" \
            "- source: \`$GITHUB_SHA\`" \
            "")"
          gh release create "v$PATCH" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$PATCH" --notes "$notes" --generate-notes
